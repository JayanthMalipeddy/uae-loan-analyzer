[project]
name = "uae-loan-emi-calculator"
version = "0.3.0"
description = "UAE Loan Analyzer (Excel upload + insights) and Loan EMI Calculator, built with Streamlit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.45",
    "pandas>=2.2",
    "plotly>=5.22",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false
